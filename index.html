<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cards_julian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="d-flex justify-content-center align-items-center min-vh-100">
        <div id="card" class="card " style="max-width: 400px; ">
            <img class="rounded-circle mt-3" src="./assets/Capture.PNG" alt="imagen julian"
                style="width: 320px; height: 420px; object-fit: cover; border: 6px solid #3c4390; display: block; margin: auto;">
            <div class="card-body ">
                <h5 class="card-title">Julian Valderrama</h5>
                <p class="card-text">Desarrollador web</p>
                <p>Hola soy Julian Valderrama, tengo 24 años y soy desarrollador web.</p>
                <p>Tecnologias que manejo:</p>
                <span class="badge bg-primary">Python</span>
                <span class="badge bg-warning text-dark">JavaScript</span>
                <span class="badge bg-success">HTML</span>
                <span class="badge bg-info text-dark">CSS</span>
                <span class="badge bg-danger">Bootstrap</span>
                <span class="badge bg-secondary">Git</span>
                <span class="badge bg-light text-dark">GitHub</span>
                <span class="badge bg-dark">SQL</span>
                <div class="mt-3 d-flex gap-2">
                    <a href="#" class="btn btn-dark btn-sm btn-hover">GitHub</a>
                    <a href="#" class="btn btn-primary btn-sm btn-hover">LinkedIn</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
